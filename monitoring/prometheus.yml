global:
  scrape_interval: 15s


scrape_configs:
  - job_name: 'prometheus'
    static_config:
      - targets: ['localhost:9090']

  - job_name: 'linux-nodes'
    static_configs:
      - targets: ['192.168.1.201:9100']

  - job_name: 'windows-nodes'
    static_configs:
      - targets: ['192.168.1.200:9182']
