---
- name: Maintenance et mise à jour Linux
  hosts: linux
  become: true

  vars:
    max_disk_usage_percent: 85
    allow_reboot: false
    required_services:
      - ssh.service
      - nginx.service

  tasks:
    #---------------- Contrôles avant --------------
    - name: Collecter l'état des services
      ansible.builtin.service_facts:

    - name: Vérifier que les services critiques tournent avant la mise a jour
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item].state == 'running'
        fail_msg: "{{ item }} n'est pas démarreé, mise a jour annulée"
      loop: "{{ required_services }}"

    - name: Calculer l'occupation du disque racine
      ansible.builtin.set_fact:
        root_usage: >-
          {{ (100 - (root_mount.size_available / root_mount.size_total * 100)) | round(1) }}
      vars:
        root_mount: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first }}"

    - name: Vérifier l'espace disque avant la mise à jour
      ansible.builtin.assert:
        that:
          - root_usage | float < max_disk_usage_percent
        fail_msg: "Disque / à {{ root_usage }} % seuil {{ max_disk_usage_percent }} %"
        success_msg: "Disque / à {{ root_usage }} %"

#----------------- Mise à jour ----------------------
    - name: Mettre à jour l'index des paquets
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Appliquer les mises à jour
      ansible.builtin.apt:
        upgrade: dist
      register: apt_upgrade

    - name: Supprimer les paquets devenus inutiles
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
#--------------------Redémarrage contrôlé-------------------
    - name: Vérifier si un redémarrage est requis
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Signaler un redémarrage requis non autorisé
      ansible.builtin.debug:
         msg: "Redémarrage requis mais non autorisé (relancer avec -e allow_reboot=true)"
      when: reboot_required.stat.exists and not allow_reboot

    - name: Redémarrer si requis et autorisé
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: reboot_required.stat.exists and allow_reboot

#-------------------Contrôles après-----------------------------
    - name: Recoller l'état des services
      ansible.builtin.service_facts:

    - name: Vérifier les services après mise à jour
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item].state == 'running'
        fail_msg: "{{ item }} n'est pas démarré après la mise à jour"
      loop: "{{ required_services }}"

    - name: Vérifier qu'aucune unité systemd n est en échec
      ansible.builtin.command: systemctl --failed --no-legend
      register: failed_units
      changed_when: false
      failed_when: failed_units.stdout | length > 0

    - name: Vérifier que nginx répond
      ansible.builtin.uri:
        url: http://localhost
        status_code: 200
