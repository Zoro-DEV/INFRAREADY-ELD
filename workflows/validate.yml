name: Validate infrastructure code
on:
  push:
  pull_request:
jobs:
  validate:
    runs_on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: python -m pip install --user ansible-core
      - name: Syntax-check playbooks
        run: |
          if find playbooks -name '*.yml' -o -name '*.yml' | grep -q .; then
            find playbooks -type f \(-name'*.yml' -o -name ''*.yml' \) \\
              -print0 | xargs -0 -r -n1 ansible-playbook --syntax -check
          else
            echo "No playbooks found; nothing to syntax-check."
          fi
